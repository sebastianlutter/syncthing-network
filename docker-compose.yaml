version: '3.8'

services:
  syncthing-relay:
    image: syncthing/relaysrv:2
    restart: unless-stopped
    command:
      - -pools=         # empty => private relay
      - -debug
      - -listen=:22067
      - -status-srv=:22070
    ports:
      - 22067:22067/tcp      # relay data
      - 22070:22070/tcp      # relay status UI (optional)
    networks:
      - public-gateway

  lunet-discosrv:
    image: syncthing/discosrv:2
    restart: unless-stopped
    # Persist DB (device mappings etc.)
    volumes:
      - discosrv:/var/stdiscosrv
    # stdiscosrv behind a TLS reverse proxy must run in HTTP mode
    # and typically listens on :8443 internally.
    command:
      - --http
      - --listen=:8443
    expose:
      - "8443"
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=public-gateway
        - traefik.constraint-label=public-gateway

        # HTTP Routers
        - traefik.http.routers.syncthing-discosrv.rule=Host(`discovery.sebastianlutter.de`)
        - traefik.http.routers.syncthing-discosrv.entrypoints=http,https
        - traefik.http.routers.syncthing-discosrv.tls=true
        - traefik.http.routers.syncthing-discosrv.tls.certresolver=myresolver
        - traefik.http.routers.syncthing-discosrv.tls.domains[0].main=discovery.sebastianlutter.de
        - traefik.http.routers.syncthing-discosrv.middlewares=syncthing-discosrv-mw,htransformation@file

        # Required headers for stdiscosrv behind a proxy (per docs)
        # passtlsclientcert will provide X-SSL-Cert
        - traefik.http.middlewares.syncthing-discosrv-mw.passtlsclientcert.pem=true
        # Add/forward these if not already done by your global middleware:
        - traefik.http.middlewares.syncthing-discosrv-mw.headers.customrequestheaders.X-Forwarded-For=
        - traefik.http.middlewares.syncthing-discosrv-mw.headers.customrequestheaders.X-Client-Port=
        # Service -> container port
        - traefik.http.services.syncthing-discosrv.loadbalancer.server.port=8443
    networks:
      - public-gateway

  lunet-syncthing:
    image: syncthing/syncthing:2
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      # Expose GUI on 8384 (Traefik terminates TLS)
      - STGUIADDRESS=0.0.0.0:8384
    hostname: lunet-upstream
    volumes:
      - syncthing-data:/var/syncthing
    expose:
      - "8384"             # expose to Traefik only
    ports:
      - 22000:22000/tcp    # TCP sync
      - 22000:22000/udp    # QUIC
      - 21027:21027/udp    # local discovery
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=public-gateway
        - traefik.constraint-label=public-gateway
        - traefik.http.routers.syncthing.entrypoints=https
        - traefik.http.routers.syncthing.rule=Host(`sync.${DOMAIN}`)
        - traefik.http.routers.syncthing.tls=true
        - traefik.http.routers.syncthing.tls.certresolver=myresolver
        - traefik.http.services.syncthing.loadbalancer.server.port=8384
        - traefik.http.middlewares.syncthing-auth.basicauth.users=${USERNAME}:${HASHED_PASSWORD}
        - traefik.http.routers.syncthing.middlewares=syncthing-auth
    networks:
      - public-gateway

volumes:
  discosrv: {}
  syncthing-data: {}

networks:
  public-gateway:
    external: true
